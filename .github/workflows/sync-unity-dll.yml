name: Sync Unity package DLL

on:
  push:
    branches: [main]
    paths:
      - "src/FreeD/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RingBuffer
        uses: actions/checkout@v4
        with:
          repository: CIFER-tech/RingBuffer
          path: RingBuffer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build FreeD (Release)
        run: dotnet build src/FreeD/FreeD.csproj -c Release -p:RingBufferProject=${{ github.workspace }}/RingBuffer/src/RingBuffer/RingBuffer.csproj

      - name: Copy build output into Unity package
        run: |
          cp src/FreeD/bin/Release/netstandard2.1/CIFER.tech.FreeD.Core.dll Unity/Runtime/CIFER.tech.FreeD.Core.dll
          cp src/FreeD/bin/Release/netstandard2.1/CIFER.tech.FreeD.Core.pdb Unity/Runtime/CIFER.tech.FreeD.Core.pdb

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Unity/Runtime/CIFER.tech.FreeD.Core.dll Unity/Runtime/CIFER.tech.FreeD.Core.pdb
          if git diff --cached --quiet; then
            echo "CIFER.tech.FreeD.Core.dll is already up to date."
          else
            git commit -m "chore(unity): sync CIFER.tech.FreeD.Core.dll from src/FreeD

          Auto-generated by .github/workflows/sync-unity-dll.yml"
            git push
          fi
