name: Sync Unity package DLL

on:
  push:
    branches: [main]
    paths:
      - "src/FreeD/**"
  workflow_dispatch:

permissions:
  contents: write

# 同時に 2 つ走ると、あとのほうの push が弾かれるので、順番に動かす
concurrency:
  group: sync-unity-dll
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      # 順番待ちのあいだに、前の実行が DLL をコミットしていることがあるので、main の最新を取り出す
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout RingBuffer
        uses: actions/checkout@v4
        with:
          repository: CIFER-tech/RingBuffer
          ref: v4.0.0
          path: RingBuffer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build FreeD (Release)
        run: dotnet build src/FreeD/FreeD.csproj -c Release -p:RingBufferProject=${{ github.workspace }}/RingBuffer/src/RingBuffer/RingBuffer.csproj

      - name: Copy build output into Unity package
        run: |
          cp src/FreeD/bin/Release/netstandard2.1/CIFER.tech.FreeD.Core.dll src/FreeD.Unity/Runtime/CIFER.tech.FreeD.Core.dll

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          built_from=$(git rev-parse HEAD)
          git add src/FreeD.Unity/Runtime/CIFER.tech.FreeD.Core.dll
          if git diff --cached --quiet; then
            echo "CIFER.tech.FreeD.Core.dll is already up to date."
          else
            git commit -m "chore(unity): sync CIFER.tech.FreeD.Core.dll from src/FreeD

          Auto-generated by .github/workflows/sync-unity-dll.yml"
            # このジョブのあいだに main が進んでいても、push が弾かれないようにする。
            # ただし、ビルドしたあとに src/FreeD が変わっていたら、古いソースの DLL になるので push しない。
            # その変更の同期の実行が、DLL を作り直す。
            git fetch origin main
            if ! git diff --quiet "$built_from" FETCH_HEAD -- src/FreeD ; then
              echo "ビルドのあとに src/FreeD が変わったので、push しない。"
              exit 0
            fi
            git rebase FETCH_HEAD
            git push
          fi
